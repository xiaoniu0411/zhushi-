<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>古文注释练习（多课程版）</title>
<style>
body{font-family:Microsoft JhengHei,sans-serif;margin:0;background:#eef2ff}
.wrap{display:flex;min-height:100vh}
.sidebar{width:260px;background:#1e293b;color:#fff;padding:20px}
.lesson{padding:12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#334155}
.lesson.active{background:#2563eb}
.main{flex:1;padding:30px}
.topbar{display:none;position:fixed;top:0;left:0;right:0;background:#fff;padding:12px 16px;
box-shadow:0 2px 10px rgba(0,0,0,.1);align-items:center;justify-content:space-between}
.card{background:#fff;border-radius:18px;padding:30px;max-width:900px;margin:auto}
.question{font-size:34px;font-weight:bold;margin:20px 0}
.highlight{background:#fde68a;padding:2px 5px;border-radius:4px}
.answer{margin-top:20px;padding:15px;background:#ecfdf5;border-left:5px solid #22c55e}
button{padding:10px 20px}
input{width:100%;padding:12px;font-size:18px}
@media(max-width:768px){
.sidebar{display:none}
.wrap{display:block}
.topbar{display:flex}
.main{padding-top:80px}
}
</style>
</head>
<body>

<div class="topbar">
<button onclick="prevLesson()">←</button>
<div id="mobileTitle"></div>
<button onclick="nextLessonBtn()">→</button>
</div>

<div class="wrap">
<div class="sidebar">
<h2>📚 古文练习</h2>
<div id="lessonList"></div>
</div>

<div class="main">
<div class="card">
<div id="progress"></div>
<div id="question" class="question"></div>
<input id="userInput" placeholder="请输入注释">
<br><br>
<button onclick="submitQuestion()" id="submitBtn">提交</button>
<div class="answer" id="answer"></div>
</div>
</div>
</div>

<script>
const lessons=[
{
title:"第一课：庖丁解牛",
questions:[
["踦","通“倚”，抵住、支撑"], ["砉然响然","牛只皮骨分离的声音"], ["奏刀騞然","进刀时发出的声音"], ["奏刀*騞*然","象声词，比“砉然”声音更大"], ["中音","合乎音律"], ["嘻","赞叹声"], ["盖（he）","通“盍”，怎么"], ["进乎技艺","超过技术了"], ["*进*乎技艺","超过"], ["臣以神*遇*而不以目视","会合、接触"], ["*官知*止而神欲行","耳、眼等器官的感觉"], ["官知止而*神欲*行","精神活动。意思是解牛时主要不是靠感觉器官，而是只用精神活动来行事"], ["天理","指牛体天生的生理（肌理）结构"], ["批大郤（xi）","劈入大的缝隙"], ["*批*大郤","劈"], ["批大*郤*","空隙，指牛骨节间的空隙"], ["导大窾","顺着（骨节间的）空隙进刀"], ["*导*大窾","顺着、循着，这里有导入的意思"], ["导大*窾*","空，指骨节空穴处"], ["因其固然","依照牛体原本的结构"], ["*因*其固然","顺着"], ["因其*固然*","本来的结构"], ["*技*经肯綮之未尝","应作“枝”。指枝脉"], ["技*经*肯綮之未尝","经脉"], ["*技经*肯綮之未尝","犹言经络"], ["技经*肯*綮之未尝","筋肉聚处"], ["𮝴（gu）","大骨"], ["族庖","一般厨师"], ["*族*庖","众，一般"], ["新发于硎","刀刚在磨刀石上磨过。形容非常锋利或初露锋芒"], ["*新发*于硎","刚磨过"], ["新发于*硎*","磨刀石"], ["无厚","没有厚度。形容刀口薄而锋利"], ["*恢恢*乎其于游刃必有余地矣","宽绰"], ["恢恢乎*其*于游刃必有余地矣","代词，代上文的“间”"], ["恢恢乎其于*游刃*必有余地矣","运转、活动刀子"], ["怵然","警惕的样子"], ["视为止，行为迟","目光为之停留（指目光专注），动作为之缓慢下来"], ["视*为*止，行为迟","因"], ["视为*止*，行为迟","停留"], ["视为止，行为*迟*","放慢"], ["謋","象声词。这里形容牛体骨肉迅速分离的声音"], ["委地","散落在地上"], ["踌躇满志","从容自得，心满意足的样子"], ["善刀","拭刀"], ["*善*刀","通“缮”，拭、擦的意思"],
]
},
{
title:"第二课：公输",
questions:[
["起","出发，动身"],
["何命焉为","有什么见教呢？“焉”与“为”合用，表示疑惑语气。"],
["借","依靠，借助"],
["说","通“悦”，高兴，愉快"],
["义","遵循道义"],
["争","同“诤”，劝谏"],
["忠","办事尽心竭力"],
["强","竭力，尽力"],
["知类","明白道理"],
["然","语气词，那么"],
["见","引见"],

["文轩","华美的车子"],
["*文*轩","装饰"],
["文*轩*","古代一种有围棚或帷幕的车"],

["敝與","破旧的车子"],

["糠糟","指粗劣的食物"],
["*糠*糟","粗劣的食物（糠：谷皮）"],
["糠*糟*","酒糟，做酒剩下的渣子"],

["犀","犀牛"],
["兕","雌性的犀牛"],
["麋鹿","一种珍贵的稀有兽类，俗称“四不像”"],
["鼋","大鳖"],
["鼍","鳄鱼的一种，俗称猪龙婆，即今扬子鳄"],

["牒","古代书写用的木片或竹片"],

["九设攻城之机变","多次设下攻城的巧妙战略"],
["*九*设攻城之机变","表示次数多"],
["九设攻城之*机变*","巧妙战术"],

["与","比"],

["距","通“拒”，抵挡，对付"],

["守圉","指墨子守城的方法"],
["守*圉*","通“御”，防御"],

["诎","通“屈”，屈服，折服，这里亦指技穷"]
]
},
    {
title:"第四课：爱庐小品选",
questions:[
["系溺","牵系陷溺"],
["因循蹉跎","得过且过，虚度光阴"],
["决裂","决断刚烈"],
["灵根","犹言清明的智慧"],
["醉生梦死","形容人糊里糊涂地过日子"],
["慧根","这里指人天赋的智慧"],
["慊","满足、满意"],

["铁杵","指上细下粗的铁棒"],

["性燥心粗，一生不济","指性情急躁，心思不细密的人，一辈子没有成就"],

["云烟","比喻书法笔势洒脱"],

["古香","指书法作品所散发出来的香味"],

["笔饱墨酣","形容文章表达流畅，内容充实"],
["笔*饱*墨酣","充分，充满"],
["笔饱墨*酣*","浓盛"],

["绝境","这里指无人能比的高超境界"],

["拂逆","违背心愿"],

["以","而"],

["节义昭著","操守和义行显著"],

["立品","培养品德"],

["立心","树立准则"]
]
},
  {
title:"第八课：关雎",
questions:[
  ["洲","水中的陆地，如沙丘或小岛"],

["窈窕","女子娴静而优美的样子"],
["*窈*窕","美心为窈"],
["窈*窕*","美状为窕"],

["淑女","德行、品行和风姿皆好的女子"],
["好逑","美好的配偶、伴侣"],
["好*逑*","配偶"],

["参差","长短、高低不齐的样子"],

["流","摘取"],

["寤寐","此处意为日日夜夜"],
["*寤*寐","睡醒"],
["寤*寐*","睡着"],

["思服","思念"],

["悠哉","形容思念深长的样子"],

["辗转反侧","翻来覆去，形容不能入睡"],

["友","亲爱。这里作动词，指亲近爱护淑女"],

["芼","择取"],

["乐","使高兴，使快乐"]
]
},
  {
title:"第九课：硕鼠",
questions:[
  ["无","通“毋”，不要"],

["三岁","多年"],

["贯","服事，侍奉"],

["女","通“汝”，这儿指剥削者"],

["逝","通“誓”，立誓，表示坚决"],

["去","离开"],

["适","到"],

["爰","于此，在这里"],

["所","处所，指可以安居之处"],

["德","报德，感激"],

["直","通“值”，价值"],

["苗","禾苗，泛指庄稼"],

["劳","慰劳"],

["永号","长声地呼号"],
["*永*号","长久地"],
["永*号*","呼号、大声哭喊"]
]
},
];

let lessonIndex=0,current=0,showing=false,questions=[];

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

function loadLesson(i){
lessonIndex=i;
questions=[...lessons[i].questions];
shuffle(questions);
current=0;
renderLessonList();
render();
}

function renderLessonList(){
let html="";
lessons.forEach((l,i)=>{
html+=`<div class="lesson ${i===lessonIndex?'active':''}" onclick="loadLesson(${i})">${l.title}</div>`;
});
lessonList.innerHTML=html;
mobileTitle.innerHTML="<b>"+lessons[lessonIndex].title+"</b>";
}

function render(){
progress.innerText=`${current+1} / ${questions.length}`;
let q=questions[current][0].replace(/\*(.*?)\*/g,'<span class="highlight">$1</span>');
question.innerHTML=q;
answer.innerHTML="";
userInput.value="";
submitBtn.innerText="提交";
showing=false;
}

function submitQuestion(){
if(!showing){
answer.innerHTML="<b>标准答案：</b>"+questions[current][1];
submitBtn.innerText="下一题";
showing=true;
}else{
current++;
if(current>=questions.length){
alert("本课完成！");
current=0;
shuffle(questions);
}
render();
}
}

function prevLesson(){
lessonIndex=(lessonIndex-1+lessons.length)%lessons.length;
loadLesson(lessonIndex);
}

function nextLessonBtn(){
lessonIndex=(lessonIndex+1)%lessons.length;
loadLesson(lessonIndex);
}

userInput.addEventListener("keydown",e=>{
if(e.key==="Enter")submitQuestion();
});

loadLesson(0);
</script>
</body>
</html>

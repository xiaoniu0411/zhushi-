<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>古文注释练习（多课程版）</title>
<style>
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:"Microsoft JhengHei",sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    display:flex;
    height:100vh;
}
.sidebar{
    width:260px;
    background:rgba(30,41,59,0.95);
    color:white;
    padding:30px 20px;
    box-shadow:4px 0 20px rgba(0,0,0,.15);
}
.sidebar h2{
    margin-top:0;
}
.lesson{
    background:rgba(255,255,255,.1);
    padding:16px;
    border-radius:14px;
    transition:.2s;
    border:1px solid rgba(255,255,255,.15);
}
.lesson:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.15);
}

.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    width:min(900px,100%);
    background:white;
    border-radius:24px;
    padding:50px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.progress{
    color:#64748b;
    font-size:18px;
    margin-bottom:20px;
}

.question{
    min-height:40px;
    font-size:20px;
    font-weight:bold;
    color:#1e293b;
    margin-bottom:30px;
    width:260px;
}

input{
    width:260px;
    padding:18px;
    font-size:20px;
    border-radius:12px;
    border:2px solid #dbeafe;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#60a5fa;
    box-shadow:0 0 15px rgba(96,165,250,.2);
}

button{
    margin-top:25px;
    background:#2563eb;
    color:white;
    border:none;
    padding:15px 36px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-1px);
}

.answer{
    margin-top:30px;
    padding:20px;
    background:#f0fdf4;
    border-left:5px solid #22c55e;
    border-radius:10px;
    font-size:22px;
    color:#166534;
    min-height:40px;
}

.tip{
    margin-top:15px;
    color:#94a3b8;
    font-size:14px;
}

.highlight{
    background:#fde68a;
    padding:2px 6px;
    border-radius:6px;
}
.lessonBar{
    display:none;
}

.lessonBtn{
    width:40px;
    height:40px;
    border-radius:50%;
    padding:0;
    margin:0;
}

@media(max-width:768px){

    body{
        display:block;
        height:auto;
    }

    .sidebar{
        display:none;
    }

    .lessonBar{
        display:flex;
        justify-content:space-between;
        align-items:center;

        position:fixed;
        top:0;
        left:0;
        right:0;

        background:white;
        padding:15px 20px;
        box-shadow:0 5px 15px rgba(0,0,0,.08);
        z-index:999;
    }

    .main{
        padding:20px;
        margin-top:70px;
        align-items:flex-start;
    }

    .card{
        padding:30px;
    }

    .question{
        font-size:30px;
    }
}
</style>
</head>
<body>

<div class="topbar">
<button onclick="prevLesson()">←</button>
<div id="mobileTitle"></div>
<button onclick="nextLessonBtn()">→</button>
</div>

<div class="wrap">
<div class="sidebar">
<h2>📚 古文练习</h2>
<div id="lessonList"></div>
</div>

<div class="main">
<div class="card">
<div id="progress"></div>
<div id="question" class="question"></div>
<input id="userInput" placeholder="请输入注释">
<br><br>
<button onclick="submitQuestion()" id="submitBtn">提交</button>
<div class="answer" id="answer"></div>
</div>
</div>
</div>

<script>
const lessons=[
{
title:"第一课 · 庖丁解牛",
questions:[
["踦","通“倚”，抵住、支撑"], ["砉然响然","牛只皮骨分离的声音"], ["奏刀騞然","进刀时发出的声音"], ["奏刀*騞*然","象声词，比“砉然”声音更大"], ["中音","合乎音律"], ["嘻","赞叹声"], ["盖（he）","通“盍”，怎么"], ["进乎技艺","超过技术了"], ["*进*乎技艺","超过"], ["臣以神*遇*而不以目视","会合、接触"], ["*官知*止而神欲行","耳、眼等器官的感觉"], ["官知止而*神欲*行","精神活动。意思是解牛时主要不是靠感觉器官，而是只用精神活动来行事"], ["天理","指牛体天生的生理（肌理）结构"], ["批大郤（xi）","劈入大的缝隙"], ["*批*大郤","劈"], ["批大*郤*","空隙，指牛骨节间的空隙"], ["导大窾","顺着（骨节间的）空隙进刀"], ["*导*大窾","顺着、循着，这里有导入的意思"], ["导大*窾*","空，指骨节空穴处"], ["因其固然","依照牛体原本的结构"], ["*因*其固然","顺着"], ["因其*固然*","本来的结构"], ["*技*经肯綮之未尝","应作“枝”。指枝脉"], ["技*经*肯綮之未尝","经脉"], ["*技经*肯綮之未尝","犹言经络"], ["技经*肯*綮之未尝","筋肉聚处"], ["𮝴（gu）","大骨"], ["族庖","一般厨师"], ["*族*庖","众，一般"], ["新发于硎","刀刚在磨刀石上磨过。形容非常锋利或初露锋芒"], ["*新发*于硎","刚磨过"], ["新发于*硎*","磨刀石"], ["无厚","没有厚度。形容刀口薄而锋利"], ["*恢恢*乎其于游刃必有余地矣","宽绰"], ["恢恢乎*其*于游刃必有余地矣","代词，代上文的“间”"], ["恢恢乎其于*游刃*必有余地矣","运转、活动刀子"], ["怵然","警惕的样子"], ["视为止，行为迟","目光为之停留（指目光专注），动作为之缓慢下来"], ["视*为*止，行为迟","因"], ["视为*止*，行为迟","停留"], ["视为止，行为*迟*","放慢"], ["謋","象声词。这里形容牛体骨肉迅速分离的声音"], ["委地","散落在地上"], ["踌躇满志","从容自得，心满意足的样子"], ["善刀","拭刀"], ["*善*刀","通“缮”，拭、擦的意思"],
]
},
{
title:"第二课 · 公输",
questions:[
["起","出发，动身"],
["何命焉为","有什么见教呢？“焉”与“为”合用，表示疑惑语气。"],
["借","依靠，借助"],
["说","通“悦”，高兴，愉快"],
["义","遵循道义"],
["争","同“诤”，劝谏"],
["忠","办事尽心竭力"],
["强","竭力，尽力"],
["知类","明白道理"],
["然","语气词，那么"],
["见","引见"],

["文轩","华美的车子"],
["*文*轩","装饰"],
["文*轩*","古代一种有围棚或帷幕的车"],

["敝與","破旧的车子"],

["糠糟","指粗劣的食物"],
["*糠*糟","粗劣的食物（糠：谷皮）"],
["糠*糟*","酒糟，做酒剩下的渣子"],

["犀","犀牛"],
["兕","雌性的犀牛"],
["麋鹿","一种珍贵的稀有兽类，俗称“四不像”"],
["鼋","大鳖"],
["鼍","鳄鱼的一种，俗称猪龙婆，即今扬子鳄"],

["牒","古代书写用的木片或竹片"],

["九设攻城之机变","多次设下攻城的巧妙战略"],
["*九*设攻城之机变","表示次数多"],
["九设攻城之*机变*","巧妙战术"],

["与","比"],

["距","通“拒”，抵挡，对付"],

["守圉","指墨子守城的方法"],
["守*圉*","通“御”，防御"],

["诎","通“屈”，屈服，折服，这里亦指技穷"]
]
}
];

let lessonIndex=0,current=0,showing=false,questions=[];

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

function loadLesson(i){
lessonIndex=i;
questions=[...lessons[i].questions];
shuffle(questions);
current=0;
renderLessonList();
render();
}

function renderLessonList(){
let html="";
lessons.forEach((l,i)=>{
html+=`<div class="lesson ${i===lessonIndex?'active':''}" onclick="loadLesson(${i})">${l.title}</div>`;
});
lessonList.innerHTML=html;
mobileTitle.innerHTML="<b>"+lessons[lessonIndex].title+"</b>";
}

function render(){
progress.innerText=`${current+1} / ${questions.length}`;
let q=questions[current][0].replace(/\*(.*?)\*/g,'<span class="highlight">$1</span>');
question.innerHTML=q;
answer.innerHTML="";
userInput.value="";
submitBtn.innerText="提交";
showing=false;
}

function submitQuestion(){
if(!showing){
answer.innerHTML="<b>标准答案：</b>"+questions[current][1];
submitBtn.innerText="下一题";
showing=true;
}else{
current++;
if(current>=questions.length){
alert("本课完成！");
current=0;
shuffle(questions);
}
render();
}
}

function prevLesson(){
lessonIndex=(lessonIndex-1+lessons.length)%lessons.length;
loadLesson(lessonIndex);
}

function nextLessonBtn(){
lessonIndex=(lessonIndex+1)%lessons.length;
loadLesson(lessonIndex);
}

userInput.addEventListener("keydown",e=>{
if(e.key==="Enter")submitQuestion();
});

loadLesson(0);
</script>
</body>
</html>
